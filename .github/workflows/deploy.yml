name: Deploy to Cloudflare Pages

# Auto-deploys subjetividades.cl (Cloudflare Pages project "dreyes")
# on every push to main. Anyone with push access (e.g. danielreyespace)
# triggers a deploy — no local wrangler / no Alvaro in the loop.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Prevent overlapping deploys; let the newest push win.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js → Cloudflare Pages)
        run: npx @cloudflare/next-on-pages@1

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=dreyes --branch=main
